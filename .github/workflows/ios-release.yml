name: iOS release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example 1.0.0)'
        required: true
        type: string
      build_number:
        description: 'Unique increasing build number (for example 1)'
        required: true
        type: string
      upload_testflight:
        description: Upload to App Store Connect for TestFlight processing
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    environment: ios-release
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare source and pinned OpenCV dependency
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          python3 ios/scripts/ci-release.py validate
          python3 ios/scripts/prepare-source.py --output "$RUNNER_TEMP/source.tar.gz"
          mkdir -p "$RUNNER_TEMP/ios-source" "$RUNNER_TEMP/opencv"
          tar -xzf "$RUNNER_TEMP/source.tar.gz" -C "$RUNNER_TEMP/ios-source"
          curl --fail --location --retry 3 \
            https://github.com/opencv/opencv/releases/download/4.12.0/opencv-4.12.0-ios-framework.zip \
            -o "$RUNNER_TEMP/opencv.zip"
          echo "86b42c9f141cd9169b91be2fc380b0e556a88a95c98ccc8e7aef8349ab74cf70  $RUNNER_TEMP/opencv.zip" | shasum -a 256 -c -
          ditto -xk "$RUNNER_TEMP/opencv.zip" "$RUNNER_TEMP/opencv"
          test -f "$RUNNER_TEMP/opencv/opencv2.framework/opencv2"
          python3 "$RUNNER_TEMP/ios-source/scripts/generate-project.py"

      - name: Test portable Swift core
        shell: bash
        run: swift test --package-path "$RUNNER_TEMP/ios-source" -j 4

      - name: Sign, archive and export App Store IPA
        env:
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
        run: python3 ios/scripts/ci-release.py build

      - name: Save signed IPA and debugging symbols
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VolleySplice-${{ inputs.version }}-${{ inputs.build_number }}
          path: ${{ runner.temp }}/ios-release-output/
          if-no-files-found: error
          retention-days: 14

      - name: Upload to App Store Connect
        if: ${{ inputs.upload_testflight }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
        run: python3 ios/scripts/ci-release.py upload

      - name: Remove temporary signing credentials
        if: ${{ always() }}
        run: python3 ios/scripts/ci-release.py cleanup
