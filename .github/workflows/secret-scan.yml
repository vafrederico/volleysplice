name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      # Use the standalone scanner on both Forgejo and GitHub. The action
      # wrapper depends on GitHub-specific account and artifact APIs.
      - name: Install Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.24.3_linux_x64.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            --output "$archive"
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  $archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
      - name: Scan for secrets
        shell: bash
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCAN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ -n "$SCAN_BASE" && ! "$SCAN_BASE" =~ ^0+$ ]]; then
            log_opts="--no-merges --first-parent $SCAN_BASE..$SCAN_HEAD"
          else
            # A new branch has no previous commit; scan its reachable history.
            log_opts="--no-merges --first-parent $SCAN_HEAD"
          fi
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --log-opts="$log_opts" .
