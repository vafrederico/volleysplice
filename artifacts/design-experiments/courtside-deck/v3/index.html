const required=r=>r.needsClipReview||r.servingSide==='review';
const pending=()=>rallies.filter(required), current=()=>rallies.find(r=>r.id===selected)||rallies[0];
const hit=()=>rallies.find(r=>position>=r.startMs&&position<=r.endMs)||null;

const nearest=()=>sorted().reduce((a,b)=>distance(b)<distance(a)?b:a);
const distance=r=>Math.max(r.startMs-position,0,position-r.endMs);
const done=()=>originalQueue.filter(id=>!required(rallies.find(r=>r.id===id))).length;
const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
function time(ms,decimal=false){let units=Math.round(Math.max(0,ms)/(decimal?100:1000)),m=Math.floor(units/(decimal?600:60));let s=decimal?((units%600)/10).toFixed(1):String(units%60);return `${String(m).padStart(2,'0')}:${s.padStart(decimal?4:2,'0')}`}

function header(){return `<header class="app-header"><div class="brand">${icon('mark')}<span>VolleySplice<small class="scope">${FIXTURE.project}</small></span></div><nav class="switch" aria-label="Editing experience">${button('editor','Editor',`aria-pressed="${editor}"`)}${button('rallies','Rallies',`aria-pressed="${!editor}"`)}</nav></header>`}
function progress(withTitle=false){return `<section class="top-status" aria-label="Review progress">${withTitle?`<div class="viewline"><h1>${pending().length?'Review rallies':'Review complete'}</h1>${button('browse',`All ${rallies.length} ${icon('arrow')}`)}</div>`:''}<div class="progress-row"><span>${pending().length?`${pending().length} need review`:'Review complete'}</span><span class="num">${done()} / ${originalQueue.length} checked</span></div><div class="progress" role="progressbar" aria-label="Review completed" aria-valuemin="0" aria-valuemax="${originalQueue.length}" aria-valuenow="${done()}"><i style="width:${done()/originalQueue.length*100}%"></i></div></section>`}
function displayRally(){return (editor||mode==='browse')?(hit()||sorted().filter(r=>r.endMs<position).at(-1)||sorted()[0]):current()}
function video(cls=''){let r=displayRally();return `<section class="video ${cls}" aria-label="Synthetic match video"><img class="court" src="${FRAME}" alt="Volleyball court with Cedar and Harbor players"><div class="score"><span class="team">${FIXTURE.team1Name}</span><strong class="num">${r.team1Score} : ${r.team2Score}</strong><span class="team">${FIXTURE.team2Name}</span></div><span class="frame-note"></span><div class="playline"><i></i></div><div class="transport">${button('play',icon(playing?'pause':'play'),`aria-label="${playing?'Pause':'Play'}" aria-pressed="${playing}"`)}<time class="position"></time><span class="duration"></span></div></section>`}
function context(r){let extra=8000*zoom;return [Math.max(0,Math.min(r.baseStart,r.startMs)-extra),Math.min(FIXTURE.durationMs,Math.max(r.baseEnd,r.endMs)+extra)]}
function localTimeline(){let r=current(),[min,max]=context(r);return `<section class="rally-timing" aria-label="Rally ${r.number} timing"><div class="timing-head"><div class="edge-steps" role="group" aria-label="Adjust rally start"><span>Start</span><div>${button('start-earlier','−1s','aria-label="Move start earlier by 1 second"')}${button('start-later','+1s','aria-label="Move start later by 1 second"')}</div></div><h2>Rally ${r.number}</h2><div class="edge-steps" role="group" aria-label="Adjust rally end"><span>End</span><div>${button('end-earlier','−1s','aria-label="Move end earlier by 1 second"')}${button('end-later','+1s','aria-label="Move end later by 1 second"')}</div></div></div><div class="local-line" data-min="${min}" data-max="${max}" aria-label="Rally timeline; drag either end to adjust bounds"><div class="local-frames" aria-hidden="true">${Array(5).fill(`<img src="${FRAME}" alt="">`).join('')}</div><div class="local-range"></div><i class="local-playhead"></i>${['start','end'].map(edge=>`<button type="button" class="trim-handle" role="slider" data-edge="${edge}" aria-label="Rally ${edge} time" aria-orientation="horizontal" aria-valuemin="0" aria-valuemax="${FIXTURE.durationMs}"></button>`).join('')}</div><div class="local-scale num"><span>${time(min,true)}</span><span>${time(max,true)}</span></div><div class="bounds-readouts"><span>Start<output data-readout="start"></output></span><span>End<output data-readout="end"></output></span></div></section>`}

function render(preserve=false){
let oldList=$('.rally-list');if(oldList){listState.scrollTop=oldList.scrollTop;listState.hasPosition=true}
$('#app').innerHTML=(editor?fullEditor():mode==='review'?review():mode==='browse'?browse():bounds())+'<div class="toast" aria-live="polite"></div>';
$('#app').dataset.mode=editor?'editor':mode;syncUI();
if(mode==='browse'&&!editor){bindList();if(preserve&&listState.hasPosition){$('.rally-list').scrollTop=listState.scrollTop;syncListCenter()}else scrollToRally()}
updatePublicState()}
// Only source seeks and explicit card selections resume following. Scrolling never seeks.
function bindList(){let list=$('.rally-list');const manual=()=>{listState.following=false;updatePublicState()};
list.addEventListener('wheel',manual,{passive:true});list.addEventListener('touchstart',manual,{passive:true});list.addEventListener('pointerdown',manual,{passive:true});
list.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','PageUp','PageDown','Home','End',' '].includes(e.key))manual()});
list.addEventListener('scroll',()=>{if(list!==$('.rally-list'))return;listState.scrollTop=list.scrollTop;listState.hasPosition=true;syncListCenter()},{passive:true})}
function syncListCenter(){
let list=$('.rally-list');if(!list||!list.clientHeight)return;
let viewport=list.getBoundingClientRect(),center=viewport.top+list.clientTop+list.clientHeight/2;
let cards=[...list.querySelectorAll('.rally-card')],card=cards.reduce((best,c)=>{let rect=c.getBoundingClientRect(),b=best?.getBoundingClientRect();return !b||Math.abs(rect.top+rect.height/2-center)<Math.abs(b.top+b.height/2-center)?c:best},null);
let rally=rallies.find(r=>r.id===card?.dataset.select);if(!rally)return;
listState.centerId=rally.id;listState.scrollTop=list.scrollTop;listState.hasPosition=true;
let midpoint=(rally.startMs+rally.endMs)/2,label='List · Rally '+rally.number,marker=$('.list-cursor');
marker.style.top=midpoint/FIXTURE.durationMs*100+'%';marker.dataset.rally=rally.id;marker.dataset.positionMs=midpoint;marker.title=label+' · '+time(midpoint,true);marker.setAttribute('aria-label',marker.title);
$('.list-identity').textContent=label;$('.list-identity').title=marker.title;updatePublicState()}

function updatePublicState(){window.prototypeState={variant:1,version:3,screen:editor?'editor':mode,selected,insideRallyId:hit()?.id||null,nearestRallyId:nearest().id,positionMs:position,pending:pending().length,completed:done(),total:rallies.length,collapsed,playing,list:{scrollTop:listState.scrollTop,following:listState.following,centerRallyId:listState.centerId,centerPositionMs:(()=>{let r=rallies.find(x=>x.id===listState.centerId);return r?(r.startMs+r.endMs)/2:null})()},dragging:drag?.kind||null,current:{...current()},rallies:structuredClone(rallies)}}
function syncUI(){$$('[data-screen]').forEach(b=>b.setAttribute('aria-pressed',String(!editor&&(b.dataset.screen==='gap'?mode==='browse'&&!hit():b.dataset.screen===mode&&(mode!=='browse'||!!hit())))));let r=current(),source=editor||mode==='browse',inside=hit(),display=displayRally();if($('.position'))$('.position').textContent=time(position,true);if($('.frame-note'))$('.frame-note').textContent=source?(inside?`Rally ${inside.number} · Source`:'Source gap'):`Rally ${r.number}`;if($('.score strong'))$('.score strong').textContent=`${display.team1Score} : ${display.team2Score}`;if($('.transport .duration'))$('.transport .duration').textContent=source?`${time(FIXTURE.durationMs)} source`:duration(r)+' s';if($('.playline i'))$('.playline i').style.width=clamp(source?position/FIXTURE.durationMs*100:(position-r.startMs)/(r.endMs-r.startMs)*100,0,100)+'%';let play=$('[data-action=play]');if(play){play.innerHTML=icon(playing?'pause':'play');play.setAttribute('aria-label',playing?'Pause':'Play');play.setAttribute('aria-pressed',String(playing))}
let line=$('.local-line');if(line){let min=+line.dataset.min,max=+line.dataset.max,pct=n=>clamp((n-min)/(max-min)*100,0,100);$('.local-range').style.left=pct(r.startMs)+'%';$('.local-range').style.width=(pct(r.endMs)-pct(r.startMs))+'%';$('.local-playhead').style.left=pct(position)+'%';$('.local-playhead').hidden=position<min||position>max;for(let edge of ['start','end']){let h=$(`[data-edge=${edge}]`),value=r[edge+'Ms'];h.style.left=pct(value)+'%';h.setAttribute('aria-valuenow',value);h.setAttribute('aria-valuetext',time(value,true));h.setAttribute('aria-valuemin',edge==='start'?0:r.startMs+500);h.setAttribute('aria-valuemax',edge==='start'?r.endMs-500:FIXTURE.durationMs);$(`[data-readout=${edge}]`).textContent=time(value,true);let stepper=$(`[data-stepper=${edge}]`);if(stepper)stepper.textContent=time(value,true)}if($('.bounds-duration'))$('.bounds-duration').textContent=duration(r)+' s'}
let rail=$('.timeline');if(rail){rail.setAttribute('aria-valuenow',Math.round(position));rail.setAttribute('aria-valuetext',`${time(position,true)}, ${inside?'Rally '+inside.number:'no rally'}`);$('.cursor').style.top=position/FIXTURE.durationMs*100+'%';$('.cursor').title='Play · '+time(position,true);$('.cursor').setAttribute('aria-label',$('.cursor').title);$$('.seg').forEach(s=>s.classList.toggle('selected-seg',s.dataset.rally===inside?.id));$$('.rally-card').forEach(c=>{let active=c.dataset.select===inside?.id;c.classList.toggle('selected',active);if(active)c.setAttribute('aria-current','true');else c.removeAttribute('aria-current')});$('.source-status').textContent=inside?`Rally ${inside.number} · ${time(position,true)} in source`:`No rally at ${time(position,true)}`;$('.source-status').classList.toggle('gap',!inside);$('[data-action=missing]').classList.toggle('gap-action',!inside)}
if($('#source-seek')){$('#source-seek').value=position;$('[for=source-seek] time').textContent=time(position,true);$('.editor-status').textContent=inside?`Inside Rally ${inside.number}`:`No rally at ${time(position,true)}`;$('[data-action=add]').disabled=!!inside}updatePublicState()}
function scrollToRally(){let list=$('.rally-list'),target=hit()||nearest(),card=$(`[data-select="${target.id}"]`);if(!list||!card)return;let lr=list.getBoundingClientRect(),cr=card.getBoundingClientRect();list.scrollTop=clamp(list.scrollTop+cr.top-lr.top-(list.clientHeight-cr.height)/2,0,list.scrollHeight-list.clientHeight);syncListCenter()}
function seekSource(value,pause=true){let before=nearest().id;position=clamp(value,0,FIXTURE.durationMs);if(pause){playing=false;listState.following=true}selected=(hit()||nearest()).id;syncUI();if(mode==='browse'&&!editor&&listState.following&&(pause||nearest().id!==before))scrollToRally()}
function setBound(edge,value){let r=current();r[edge+'Ms']=edge==='start'?clamp(Math.round(value),0,r.endMs-500):clamp(Math.round(value),r.startMs+500,FIXTURE.durationMs);position=r[edge+'Ms'];playing=false;syncUI()}
function refreshContext(){let line=$('.local-line');if(!line)return;let [min,max]=context(current());line.dataset.min=min;line.dataset.max=max;let spans=$$('.local-scale span');spans[0].textContent=time(min,true);spans[1].textContent=time(max,true);syncUI()}
function changeMode(next){playing=false;editor=false;mode=next;returnMode=next==='bounds'?'review':next;zoom=1;render(next==='browse'&&listState.hasPosition)}
function openEditor(){if(!editor)returnMode=mode==='bounds'?'browse':mode;editor=true;playing=false;addedId=null;render()}
function choose(id){listState.following=true;selected=id;position=current().startMs;playing=false;render(true);scrollToRally()}
function notify(text){let el=$('.toast');if(!el)return;el.textContent=text;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>{if($('.toast'))$('.toast').textContent=''},1100)}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled||b.dataset.edge)return;if(b.dataset.select){choose(b.dataset.select);return}if(b.dataset.screen){if(b.dataset.screen==='gap'){changeMode('browse');let r=rallies.find(x=>x.id===FIXTURE.selectedRallyId),next=sorted().find(x=>x.startMs>r.endMs);seekSource((r.endMs+next.startMs)/2)}else changeMode(b.dataset.screen);return}let a=b.dataset.action,r=current();switch(a){case'reset':reset();return;case'play':if(!playing&&!(editor||mode==='browse')&&position>=r.endMs)position=r.startMs;playing=!playing;lastTick=performance.now();syncUI();return;case'keep':case'remove':r.included=a==='keep';r.needsClipReview=false;render();notify(a==='keep'?'Keep saved':'Remove saved');return;case'near':case'far':r.servingSide=a;render();notify(`${a==='near'?'Near':'Far'} serve saved`);return;case'next':if(required(r))return;{let n=pending().find(x=>x.startMs>r.startMs)||pending()[0];if(n){selected=n.id;position=n.startMs;zoom=1}render()}return;case'browse':changeMode('browse');return;case'collapse':collapsed=!collapsed;render(true);return;case'review-selected':if(pending().length){let n=required(r)?r:pending()[0];selected=n.id;position=n.startMs;changeMode('review')}else{mode='bounds';returnMode='browse';render()}return;case'close-bounds':playing=false;mode=returnMode;render();return;case'editor':openEditor();return;case'missing':openEditor();return;case'rallies':case'return':if(editor){editor=false;playing=false;mode=returnMode==='bounds'?'browse':returnMode;render()}return;case'add':{if(hit())return;let before=sorted().filter(x=>x.endMs<position).at(-1),after=sorted().find(x=>x.startMs>position);let start=Math.max(before?.endMs??0,position-3000),end=Math.min(after?.startMs??FIXTURE.durationMs,position+5000);if(end-start<500){notify('This gap is shorter than 0.5 s');return}let n={id:'A'+(rallies.length+1),number:rallies.length+1,startMs:start,endMs:end,baseStart:start,baseEnd:end,team1Score:before?.team1Score??0,team2Score:before?.team2Score??0,included:true,needsClipReview:false,servingSide:before?.servingSide==='far'?'far':'near',added:true};rallies.push(n);selected=n.id;addedId=n.id;render();notify(`Rally ${n.number} added`)}return;default:if(/^(start|end)-(earlier|later)$/.test(a||'')){let [edge,dir]=a.split('-');setBound(edge,r[edge+'Ms']+(dir==='earlier'?-1000:1000));refreshContext();return}if(/^(start|end)-(minus|plus)$/.test(a||'')){let [edge,dir]=a.split('-');setBound(edge,r[edge+'Ms']+(dir==='minus'?-100:100));refreshContext()}}});
function pointerPosition(e){if(!drag)return;if(drag.kind==='source')seekSource(clamp((e.clientY-drag.rect.top)/drag.rect.height,0,1)*FIXTURE.durationMs);else if(drag.kind==='bound')setBound(drag.edge,drag.min+(e.clientX-drag.rect.left)/drag.rect.width*(drag.max-drag.min)+drag.offset);else{position=clamp(drag.min+(e.clientX-drag.rect.left)/drag.rect.width*(drag.max-drag.min),0,FIXTURE.durationMs);playing=false;syncUI()}}
document.addEventListener('pointerdown',e=>{let handle=e.target.closest('.trim-handle'),rail=e.target.closest('.timeline'),local=e.target.closest('.local-line');if((!handle&&!rail&&!local)||e.button!==0||drag)return;e.preventDefault();let el=handle||rail||local,track=rail||local;drag={kind:handle?'bound':rail?'source':'local',edge:handle?.dataset.edge,el,id:e.pointerId,rect:track.getBoundingClientRect(),min:+track.dataset.min,max:+track.dataset.max};if(handle)drag.offset=current()[drag.edge+'Ms']-(drag.min+(e.clientX-drag.rect.left)/drag.rect.width*(drag.max-drag.min));try{el.setPointerCapture(e.pointerId)}catch{}el.classList.add('dragging');el.focus({preventScroll:true});pointerPosition(e)});
document.addEventListener('pointermove',e=>{if(drag&&drag.id===e.pointerId){e.preventDefault();pointerPosition(e)}});
function finishPointer(e){if(!drag||drag.id!==e.pointerId)return;let d=drag;if(e.type==='pointerup')pointerPosition(e);drag=null;d.el.classList.remove('dragging');if(d.el.hasPointerCapture(e.pointerId))d.el.releasePointerCapture(e.pointerId);if(d.kind==='bound')refreshContext();updatePublicState()}
document.addEventListener('pointerup',finishPointer);document.addEventListener('pointercancel',finishPointer);document.addEventListener('lostpointercapture',finishPointer);
document.addEventListener('keydown',e=>{let h=e.target.closest('.trim-handle'),rail=e.target.closest('.timeline');if(!h&&!rail)return;let keys=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End','PageUp','PageDown'];if(!keys.includes(e.key))return;e.preventDefault();if(h){let edge=h.dataset.edge,r=current(),amount=e.shiftKey?1000:100,delta=['ArrowRight','ArrowUp','PageUp'].includes(e.key)?amount:-amount;setBound(edge,e.key==='Home'?0:e.key==='End'?FIXTURE.durationMs:r[edge+'Ms']+delta);refreshContext()}else{let delta=e.key==='PageDown'?10000:e.key==='PageUp'?-10000:['ArrowRight','ArrowDown'].includes(e.key)?(e.shiftKey?100:1000):-(e.shiftKey?100:1000);seekSource(e.key==='Home'?0:e.key==='End'?FIXTURE.durationMs:position+delta)}});
document.addEventListener('input',e=>{if(e.target.id==='source-seek')seekSource(+e.target.value)});
window.addEventListener('resize',()=>requestAnimationFrame(syncListCenter));
document.fonts.ready.then(()=>requestAnimationFrame(syncListCenter));
window.addEventListener('blur',()=>{if(drag){drag.el.classList.remove('dragging');if(drag.el.hasPointerCapture(drag.id))drag.el.releasePointerCapture(drag.id);drag=null;refreshContext()}playing=false;syncUI()});
let lastTick=performance.now();setInterval(()=>{let now=performance.now(),elapsed=now-lastTick;lastTick=now;if(!playing||drag)return;if(editor||mode==='browse'){let next=Math.min(FIXTURE.durationMs,position+elapsed);if(next>=FIXTURE.durationMs)playing=false;seekSource(next,false)}else{position=Math.min(current().endMs,position+elapsed);if(position>=current().endMs)playing=false;syncUI()}},100);
reset();let initial=new URLSearchParams(location.search).get('screen');if(['review','browse','bounds'].includes(initial))changeMode(initial);
console.assert(rallies.length===36,'Fixture has 36 rallies');console.assert(pending().length===4,'Four flagged review rallies');console.assert(current().number===18&&current().team1Score===9&&current().team2Score===8,'Shared starting score');
</script></body></html>
