*{box-sizing:border-box} :root{font-synthesis:none;color-scheme:light;--ground:#eef3f4;--surface:#fff;--raised:#f4f6f8;--active:#ebedee;--border:#e8eaec;--control:#cdced1;--ink:#131416;--muted:#5d5f60;--accent:#1b6c80;--positive:#1e7b4f;--primary:#161819;--onprimary:#fff;--font:'IBM Plex Sans'}
body{margin:0;background:#e9ecee;color:var(--ink);font:14px/1.35 var(--font),sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit;min-height:48px;border:1px solid var(--control);background:var(--surface);border-radius:6px;padding:10px 14px;font-weight:500;touch-action:manipulation}button:hover{border-color:var(--muted)}button:active{transform:scale(.98)}button:focus-visible,input:focus-visible,[role=slider]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}button[disabled]{cursor:default;color:var(--muted);background:var(--raised);transform:none}button[aria-pressed=true]{color:var(--onprimary);background:var(--primary);border-color:var(--primary)}svg{width:20px;height:20px;flex:none;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}svg,button>*{pointer-events:none}.num,time,output{font-variant-numeric:tabular-nums}h1,h2,p{margin:0}h1{font-size:18px;font-weight:600}h2{font-size:16px;font-weight:500}small,.muted{color:var(--muted)}small{font-size:12px}
.experiment{min-height:44px;max-width:390px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:3px;padding:0 16px;color:#3e474a;font-size:12px}.states{display:flex;gap:0}.experiment button{font-size:12px;padding:0 7px;min-height:44px;border:0;border-radius:0;background:transparent;color:#3e474a}.experiment button[aria-pressed=true]{background:#d6dde0;color:#101719}.experiment .reset{padding:0 8px}.reset svg{width:16px;height:16px}.experiment-note{max-width:390px;margin:auto;padding:14px 16px 22px;font-size:13px;line-height:1.5;color:#485357}.experiment-note strong{display:block;font-size:14px;color:#172327;margin-bottom:4px}
/* Portrait arithmetic: 390 - 16 sheet inset - 2 border - 24 padding = 348. Two decision buttons: (348 - 8) / 2 = 170. Source: 64 rail + 326 list = 390. */
.app{width:100%;max-width:390px;height:844px;margin:auto;position:relative;background:var(--ground);overflow:hidden;display:flex;flex-direction:column}.app-header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:8px;min-height:68px;flex:none}.brand{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:600;white-space:nowrap}.brand svg{width:23px;height:23px;stroke:var(--accent)}.scope{display:block;font-size:12px;line-height:16px;font-weight:400}.switch{display:flex;background:var(--active);border-radius:999px;padding:3px;flex:none}.switch button{border:0;border-radius:999px;min-height:44px;padding:8px 12px;background:transparent;color:var(--muted)}.switch button[aria-pressed=true]{background:var(--surface);color:var(--ink)}
.top-status{padding:0 16px 12px;flex:none}.viewline{display:flex;align-items:center;justify-content:space-between;min-height:40px;gap:8px}.viewline h1{font-size:16px}.viewline button,.textbtn{background:transparent;border:0;padding:6px 0;min-height:40px}.progress-row{display:flex;align-items:center;justify-content:space-between;min-height:24px;font-size:12px;color:var(--muted)}.progress{height:4px;background:#dce3e5;border-radius:2px;overflow:hidden}.progress i{display:block;height:4px;background:var(--accent)}

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let rallies,selected,position,mode,returnMode,editor,playing,collapsed,addedId,drag=null,zoom=1;
const originalQueue=FIXTURE.rallies.filter(r=>r.needsClipReview||r.servingSide==='review').map(r=>r.id);
const required=r=>r.needsClipReview||r.servingSide==='review';
const pending=()=>rallies.filter(required), current=()=>rallies.find(r=>r.id===selected)||rallies[0];
const hit=()=>rallies.find(r=>position>=r.startMs&&position<=r.endMs)||null;
const sorted=()=>rallies.slice().sort((a,b)=>a.startMs-b.startMs);
const nearest=()=>sorted().reduce((a,b)=>distance(b)<distance(a)?b:a);
const distance=r=>Math.max(r.startMs-position,0,position-r.endMs);

function reset(){rallies=structuredClone(FIXTURE.rallies);for(const r of rallies){r.baseStart=r.startMs;r.baseEnd=r.endMs}selected=FIXTURE.selectedRallyId;position=FIXTURE.positionMs;mode='review';returnMode='review';editor=false;playing=false;collapsed=false;addedId=null;zoom=1;drag=null;render()}
function header(){return `<header class="app-header"><div class="brand">${icon('mark')}<span>VolleySplice<small class="scope">${FIXTURE.project}</small></span></div><nav class="switch" aria-label="Editing experience">${button('editor','Editor',`aria-pressed="${editor}"`)}${button('rallies','Rallies',`aria-pressed="${!editor}"`)}</nav></header>`}
function progress(withTitle=false){return `<section class="top-status" aria-label="Review progress">${withTitle?`<div class="viewline"><h1>${pending().length?'Review rallies':'Review complete'}</h1>${button('browse',`All ${rallies.length} ${icon('arrow')}`)}</div>`:''}<div class="progress-row"><span>${pending().length?`${pending().length} need review`:'Review complete'}</span><span class="num">${done()} / ${originalQueue.length} checked</span></div><div class="progress" role="progressbar" aria-label="Review completed" aria-valuemin="0" aria-valuemax="${originalQueue.length}" aria-valuenow="${done()}"><i style="width:${done()/originalQueue.length*100}%"></i></div></section>`}
function displayRally(){return (editor||mode==='browse')?(hit()||sorted().filter(r=>r.endMs<position).at(-1)||sorted()[0]):current()}
function video(cls=''){let r=displayRally();return `<section class="video ${cls}" aria-label="Synthetic match video"><img class="court" src="${FRAME}" alt="Volleyball court with Cedar and Harbor players"><div class="score"><span class="team">${FIXTURE.team1Name}</span><strong class="num">${r.team1Score} : ${r.team2Score}</strong><span class="team">${FIXTURE.team2Name}</span></div><span class="frame-note"></span><div class="playline"><i></i></div><div class="transport">${button('play',icon(playing?'pause':'play'),`aria-label="${playing?'Pause':'Play'}" aria-pressed="${playing}"`)}<time class="position"></time><span class="duration"></span></div></section>`}
function context(r){let extra=8000*zoom;return [Math.max(0,Math.min(r.baseStart,r.startMs)-extra),Math.min(FIXTURE.durationMs,Math.max(r.baseEnd,r.endMs)+extra)]}
function localTimeline(){let r=current(),[min,max]=context(r);return `<section class="rally-timing" aria-label="Rally ${r.number} timing"><div class="timing-head"><h2>Rally ${r.number}</h2><output class="length num">${duration(r)} s</output>${button('zoom','−','class="context-button" aria-label="Widen timeline context" title="Widen timeline context"')}</div><div class="local-line" data-min="${min}" data-max="${max}" aria-label="Rally timeline; drag either end to adjust bounds"><div class="local-frames" aria-hidden="true">${Array(5).fill(`<img src="${FRAME}" alt="">`).join('')}</div><div class="local-range"></div><i class="local-playhead"></i>${['start','end'].map(edge=>`<button type="button" class="trim-handle" role="slider" data-edge="${edge}" aria-label="Rally ${edge} time" aria-orientation="horizontal" aria-valuemin="0" aria-valuemax="${FIXTURE.durationMs}"></button>`).join('')}</div><div class="local-scale num"><span>${time(min,true)}</span><span>${time(max,true)}</span></div><div class="bounds-readouts"><span>Start<output data-readout="start"></output></span><span>End<output data-readout="end"></output></span></div></section>`}
function clipPair(r){return `<div class="pair" role="group" aria-label="Rally inclusion">${button('keep','Keep',`aria-pressed="${!r.needsClipReview&&r.included}" class="${r.needsClipReview?'pending':''}"`)}${button('remove','Remove',`aria-pressed="${!r.needsClipReview&&!r.included}" class="${r.needsClipReview?'pending':''}"`)}</div>`}
function sidePair(r){return `<div class="pair" role="group" aria-label="Serving side">${button('near','Near',`aria-pressed="${r.servingSide==='near'}" class="${r.servingSide==='review'?'pending':''}"`)}${button('far','Far',`aria-pressed="${r.servingSide==='far'}" class="${r.servingSide==='review'?'pending':''}"`)}</div>`}
function complete(){return `<div class="completion">${icon('check')}<h2>All checked.</h2><p>${originalQueue.length} rallies reviewed. Your choices are saved for this session.</p>${button('browse',`Browse ${rallies.length} rallies ${icon('arrow')}`,'class="primary"')}</div>`}
function review(){let r=current();return `${header()}${progress(true)}${video()}<section class="review-body">${pending().length===0?complete():`${localTimeline()}${clipPair(r)}${sidePair(r)}<div class="summary"><span class="saved-tag">${!required(r)?'Saved':''}</span></div>${button('next',`${pending().length===1?'Finish review':'Next review'} ${icon('arrow')}`,`class="primary next-action" ${required(r)?'disabled':''} aria-label="${required(r)?'Resolve highlighted decisions before next review':pending().length===1?'Finish review':'Next review'}"`)}`}</section>`}
function timeline(){return `<aside class="sourcebar" aria-label="Source-proportional vertical timeline"><small>00:00</small><div class="timeline" role="slider" aria-label="Source position" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="${FIXTURE.durationMs}" tabindex="0"><i class="track"></i>${rallies.map(r=>`<i class="seg ${required(r)?'pending-seg':''}" data-rally="${r.id}" style="top:${r.startMs/FIXTURE.durationMs*100}%;height:${(r.endMs-r.startMs)/FIXTURE.durationMs*100}%"></i>`).join('')}<i class="cursor"></i></div><small>${time(FIXTURE.durationMs)}</small><span class="key">Source</span></aside>`}
function cards(){return sorted().map(r=>`<button type="button" class="rally-card" data-select="${r.id}" aria-label="Rally ${r.number}, ${FIXTURE.team1Name} ${r.team1Score}, ${FIXTURE.team2Name} ${r.team2Score}, ${required(r)?'needs review':r.included?'kept':'removed'}"><img src="${FRAME}" alt="Rally ${r.number} start frame"><span class="card-info"><strong>Rally ${r.number}</strong><small>${time(r.startMs)} · ${duration(r)} s</small></span><span class="card-score"><span class="num">${r.team1Score} : ${r.team2Score}</span><small>${required(r)?'Review':r.included?'Keep':'Remove'}</small></span></button>`).join('')}
function browse(){return `${header()}${progress()}${video('browse-video')}<div class="browse-tools"><h1>${rallies.length} rallies</h1>${button('collapse',`${icon('rail')} ${collapsed?'Show source':'Hide source'}`,`aria-expanded="${!collapsed}"`)}</div><p class="source-status" aria-live="polite"></p><section class="browse-layout ${collapsed?'collapsed':''}">${timeline()}<div class="rally-list" aria-label="All rallies">${cards()}</div></section><div class="browse-foot">${button('review-selected',pending().length?`Review ${pending().length}`:'Edit selected')}${button('missing',`${icon('plus')} Add missing rally`)}</div>`}
function bounds(){let r=current();return `${header()}${progress()}${video('bounds-video')}<section class="bounds-body"><div class="bounds-head"><h1>Rally ${r.number} bounds</h1>${button('close-bounds','Done','class="textbtn"')}</div>${localTimeline()}<p class="timing-help">Drag either end. Arrow keys adjust 0.1 s; Shift adjusts 1 s.</p>${['start','end'].map(edge=>`<div class="trim-row"><span>${edge==='start'?'Start':'End'}</span>${button(edge+'-minus','−',`aria-label="${edge} minus 0.1 seconds"`)}<output data-stepper="${edge}"></output>${button(edge+'-plus','+',`aria-label="${edge} plus 0.1 seconds"`)}</div>`).join('')}<div class="summary"><span>Changes saved as you edit</span><span class="bounds-duration num">${duration(r)} s</span></div>${button('close-bounds',`Save bounds ${icon('check')}`,'class="primary"')}</section>`}
function fullEditor(){return `${header()}${progress()}${video('editor-video')}<section class="editor-body"><div class="editor-return"><h1>Full Editor</h1>${button('return',`${icon('back')} Rallies`)}</div><p class="muted editor-note">${addedId?'Rally added. Continue here or return to Rallies.':'Scrub the source to edit any moment.'}</p><div class="mock-timeline" aria-label="Full source filmstrip">${Array(7).fill(`<img src="${FRAME}" alt="Synthetic source frame">`).join('')}</div><label for="source-seek">Source position <time></time></label><input id="source-seek" type="range" min="0" max="${FIXTURE.durationMs}" step="1" value="${position}"><div class="summary"><span class="editor-status"></span><span>26:00 source</span></div>${button('add',`${icon('plus')} Add rally here`,'class="primary"')}${button('return',`Return to Rallies ${icon('arrow')}`,'class="back-after"')}</section>`}
function render(preserve=false){let oldScroll=$('.rally-list')?.scrollTop||0;$('#app').innerHTML=(editor?fullEditor():mode==='review'?review():mode==='browse'?browse():bounds())+'<div class="toast" aria-live="polite"></div>';$('#app').dataset.mode=editor?'editor':mode;$$('[data-screen]').forEach(b=>b.setAttribute('aria-pressed',String(!editor&&(b.dataset.screen==='gap'?mode==='browse'&&!hit():b.dataset.screen===mode))));syncUI();if(mode==='browse'&&!editor){if(preserve)$('.rally-list').scrollTop=oldScroll;else scrollToRally()}updatePublicState()}
function updatePublicState(){window.prototypeState={variant:1,version:2,screen:editor?'editor':mode,selected,insideRallyId:hit()?.id||null,nearestRallyId:nearest().id,positionMs:position,pending:pending().length,completed:done(),total:rallies.length,collapsed,playing,dragging:drag?.kind||null,current:{...current()},rallies:structuredClone(rallies)}}
function syncUI(){$$('[data-screen]').forEach(b=>b.setAttribute('aria-pressed',String(!editor&&(b.dataset.screen==='gap'?mode==='browse'&&!hit():b.dataset.screen===mode&&(mode!=='browse'||!!hit())))));let r=current(),source=editor||mode==='browse',inside=hit(),display=displayRally();if($('.position'))$('.position').textContent=time(position,true);if($('.frame-note'))$('.frame-note').textContent=source?(inside?`Rally ${inside.number} · Source`:'Source gap'):`Rally ${r.number}`;if($('.score strong'))$('.score strong').textContent=`${display.team1Score} : ${display.team2Score}`;if($('.transport .duration'))$('.transport .duration').textContent=source?`${time(FIXTURE.durationMs)} source`:duration(r)+' s';if($('.playline i'))$('.playline i').style.width=clamp(source?position/FIXTURE.durationMs*100:(position-r.startMs)/(r.endMs-r.startMs)*100,0,100)+'%';let play=$('[data-action=play]');if(play){play.innerHTML=icon(playing?'pause':'play');play.setAttribute('aria-label',playing?'Pause':'Play');play.setAttribute('aria-pressed',String(playing))}
let line=$('.local-line');if(line){let min=+line.dataset.min,max=+line.dataset.max,pct=n=>clamp((n-min)/(max-min)*100,0,100);$('.local-range').style.left=pct(r.startMs)+'%';$('.local-range').style.width=(pct(r.endMs)-pct(r.startMs))+'%';$('.local-playhead').style.left=pct(position)+'%';$('.local-playhead').hidden=position<min||position>max;for(let edge of ['start','end']){let h=$(`[data-edge=${edge}]`),value=r[edge+'Ms'];h.style.left=pct(value)+'%';h.setAttribute('aria-valuenow',value);h.setAttribute('aria-valuetext',time(value,true));h.setAttribute('aria-valuemin',edge==='start'?0:r.startMs+500);h.setAttribute('aria-valuemax',edge==='start'?r.endMs-500:FIXTURE.durationMs);$(`[data-readout=${edge}]`).textContent=time(value,true);let stepper=$(`[data-stepper=${edge}]`);if(stepper)stepper.textContent=time(value,true)}$('.length').textContent=duration(r)+' s';if($('.bounds-duration'))$('.bounds-duration').textContent=duration(r)+' s'}
let rail=$('.timeline');if(rail){rail.setAttribute('aria-valuenow',Math.round(position));rail.setAttribute('aria-valuetext',`${time(position,true)}, ${inside?'Rally '+inside.number:'no rally'}`);$('.cursor').style.top=position/FIXTURE.durationMs*100+'%';$$('.seg').forEach(s=>s.classList.toggle('selected-seg',s.dataset.rally===inside?.id));$$('.rally-card').forEach(c=>{let active=c.dataset.select===inside?.id;c.classList.toggle('selected',active);if(active)c.setAttribute('aria-current','true');else c.removeAttribute('aria-current')});$('.source-status').textContent=inside?`Rally ${inside.number} · ${time(position,true)} in source`:`No rally at ${time(position,true)}`;$('.source-status').classList.toggle('gap',!inside);$('[data-action=missing]').classList.toggle('gap-action',!inside)}
if($('#source-seek')){$('#source-seek').value=position;$('[for=source-seek] time').textContent=time(position,true);$('.editor-status').textContent=inside?`Inside Rally ${inside.number}`:`No rally at ${time(position,true)}`;$('[data-action=add]').disabled=!!inside}updatePublicState()}
function scrollToRally(){let list=$('.rally-list'),target=hit()||nearest(),card=$(`[data-select="${target.id}"]`);if(!list||!card)return;let lr=list.getBoundingClientRect(),cr=card.getBoundingClientRect();list.scrollTop=clamp(list.scrollTop+cr.top-lr.top-(list.clientHeight-cr.height)/2,0,list.scrollHeight-list.clientHeight)}
function seekSource(value,pause=true){let before=nearest().id;position=clamp(value,0,FIXTURE.durationMs);if(pause)playing=false;selected=(hit()||nearest()).id;syncUI();if(mode==='browse'&&!editor&&(pause||nearest().id!==before))scrollToRally()}
function setBound(edge,value){let r=current();r[edge+'Ms']=edge==='start'?clamp(Math.round(value),0,r.endMs-500):clamp(Math.round(value),r.startMs+500,FIXTURE.durationMs);position=r[edge+'Ms'];playing=false;syncUI()}
function refreshContext(){let line=$('.local-line');if(!line)return;let [min,max]=context(current());line.dataset.min=min;line.dataset.max=max;let spans=$$('.local-scale span');spans[0].textContent=time(min,true);spans[1].textContent=time(max,true);syncUI()}
function changeMode(next){playing=false;editor=false;mode=next;returnMode=next==='bounds'?'review':next;zoom=1;render()}
function openEditor(){if(!editor)returnMode=mode==='bounds'?'browse':mode;editor=true;playing=false;addedId=null;render()}
function choose(id){selected=id;position=current().startMs;playing=false;render(true);scrollToRally()}
function notify(text){let el=$('.toast');if(!el)return;el.textContent=text;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>{if($('.toast'))$('.toast').textContent=''},1100)}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled||b.dataset.edge)return;if(b.dataset.select){choose(b.dataset.select);return}if(b.dataset.screen){if(b.dataset.screen==='gap'){changeMode('browse');let r=rallies.find(x=>x.id===FIXTURE.selectedRallyId),next=sorted().find(x=>x.startMs>r.endMs);seekSource((r.endMs+next.startMs)/2)}else changeMode(b.dataset.screen);return}let a=b.dataset.action,r=current();switch(a){case'reset':reset();return;case'play':if(!playing&&!(editor||mode==='browse')&&position>=r.endMs)position=r.startMs;playing=!playing;lastTick=performance.now();syncUI();return;case'keep':case'remove':r.included=a==='keep';r.needsClipReview=false;render();notify(a==='keep'?'Keep saved':'Remove saved');return;case'near':case'far':r.servingSide=a;render();notify(`${a==='near'?'Near':'Far'} serve saved`);return;case'next':if(required(r))return;{let n=pending().find(x=>x.startMs>r.startMs)||pending()[0];if(n){selected=n.id;position=n.startMs;zoom=1}render()}return;case'browse':changeMode('browse');return;case'collapse':collapsed=!collapsed;render(true);return;case'review-selected':if(pending().length){let n=required(r)?r:pending()[0];selected=n.id;position=n.startMs;changeMode('review')}else{mode='bounds';returnMode='browse';render()}return;case'close-bounds':playing=false;mode=returnMode;render();return;case'zoom':zoom=Math.min(128,zoom*2);refreshContext();return;case'editor':openEditor();return;case'missing':openEditor();return;case'rallies':case'return':if(editor){editor=false;playing=false;mode=returnMode==='bounds'?'browse':returnMode;render()}return;case'add':{if(hit())return;let before=sorted().filter(x=>x.endMs<position).at(-1),after=sorted().find(x=>x.startMs>position);let start=Math.max(before?.endMs??0,position-3000),end=Math.min(after?.startMs??FIXTURE.durationMs,position+5000);if(end-start<500){notify('This gap is shorter than 0.5 s');return}let n={id:'A'+(rallies.length+1),number:rallies.length+1,startMs:start,endMs:end,baseStart:start,baseEnd:end,team1Score:before?.team1Score??0,team2Score:before?.team2Score??0,included:true,needsClipReview:false,servingSide:before?.servingSide==='far'?'far':'near',added:true};rallies.push(n);selected=n.id;addedId=n.id;render();notify(`Rally ${n.number} added`)}return;default:if(/^(start|end)-(minus|plus)$/.test(a||'')){let [edge,dir]=a.split('-');setBound(edge,r[edge+'Ms']+(dir==='minus'?-100:100));refreshContext()}}});
function pointerPosition(e){if(!drag)return;if(drag.kind==='source')seekSource(clamp((e.clientY-drag.rect.top)/drag.rect.height,0,1)*FIXTURE.durationMs);else if(drag.kind==='bound')setBound(drag.edge,drag.min+(e.clientX-drag.rect.left)/drag.rect.width*(drag.max-drag.min)+drag.offset);else{position=clamp(drag.min+(e.clientX-drag.rect.left)/drag.rect.width*(drag.max-drag.min),0,FIXTURE.durationMs);playing=false;syncUI()}}
document.addEventListener('pointerdown',e=>{let handle=e.target.closest('.trim-handle'),rail=e.target.closest('.timeline'),local=e.target.closest('.local-line');if((!handle&&!rail&&!local)||e.button!==0||drag)return;e.preventDefault();let el=handle||rail||local,track=rail||local;drag={kind:handle?'bound':rail?'source':'local',edge:handle?.dataset.edge,el,id:e.pointerId,rect:track.getBoundingClientRect(),min:+track.dataset.min,max:+track.dataset.max};if(handle)drag.offset=current()[drag.edge+'Ms']-(drag.min+(e.clientX-drag.rect.left)/drag.rect.width*(drag.max-drag.min));try{el.setPointerCapture(e.pointerId)}catch{}el.classList.add('dragging');el.focus({preventScroll:true});pointerPosition(e)});
document.addEventListener('pointermove',e=>{if(drag&&drag.id===e.pointerId){e.preventDefault();pointerPosition(e)}});
function finishPointer(e){if(!drag||drag.id!==e.pointerId)return;let d=drag;if(e.type==='pointerup')pointerPosition(e);drag=null;d.el.classList.remove('dragging');if(d.el.hasPointerCapture(e.pointerId))d.el.releasePointerCapture(e.pointerId);if(d.kind==='bound')refreshContext();updatePublicState()}
document.addEventListener('pointerup',finishPointer);document.addEventListener('pointercancel',finishPointer);document.addEventListener('lostpointercapture',finishPointer);
document.addEventListener('keydown',e=>{let h=e.target.closest('.trim-handle'),rail=e.target.closest('.timeline');if(!h&&!rail)return;let keys=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End','PageUp','PageDown'];if(!keys.includes(e.key))return;e.preventDefault();if(h){let edge=h.dataset.edge,r=current(),amount=e.shiftKey?1000:100,delta=['ArrowRight','ArrowUp','PageUp'].includes(e.key)?amount:-amount;setBound(edge,e.key==='Home'?0:e.key==='End'?FIXTURE.durationMs:r[edge+'Ms']+delta);refreshContext()}else{let delta=e.key==='PageDown'?10000:e.key==='PageUp'?-10000:['ArrowRight','ArrowDown'].includes(e.key)?(e.shiftKey?100:1000):-(e.shiftKey?100:1000);seekSource(e.key==='Home'?0:e.key==='End'?FIXTURE.durationMs:position+delta)}});
document.addEventListener('input',e=>{if(e.target.id==='source-seek')seekSource(+e.target.value)});
window.addEventListener('blur',()=>{if(drag){drag.el.classList.remove('dragging');if(drag.el.hasPointerCapture(drag.id))drag.el.releasePointerCapture(drag.id);drag=null;refreshContext()}playing=false;syncUI()});
let lastTick=performance.now();setInterval(()=>{let now=performance.now(),elapsed=now-lastTick;lastTick=now;if(!playing||drag)return;if(editor||mode==='browse'){let next=Math.min(FIXTURE.durationMs,position+elapsed);if(next>=FIXTURE.durationMs)playing=false;seekSource(next,false)}else{position=Math.min(current().endMs,position+elapsed);if(position>=current().endMs)playing=false;syncUI()}},100);
reset();let initial=new URLSearchParams(location.search).get('screen');if(['review','browse','bounds'].includes(initial))changeMode(initial);
console.assert(rallies.length===36,'Fixture has 36 rallies');console.assert(pending().length===4,'Four flagged review rallies');console.assert(current().number===18&&current().team1Score===9&&current().team2Score===8,'Shared starting score');
</script></body></html>
