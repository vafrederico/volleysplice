function persist(){try{localStorage.setItem(STORAGE,JSON.stringify({rallies}));}catch(e){}}
function header(){return `<header class="app-head"><div class="brand">${ic('ball')}<span class="brand-name">VolleySplice</span></div><nav class="mode-pill" aria-label="Experience"><button data-act="editor" class="${state.editor?'active':''}" aria-pressed="${state.editor}">Editor</button><button data-act="rallies" class="${!state.editor?'active':''}" aria-pressed="${!state.editor}">Rallies</button></nav></header>`}
function scoreboard(){const r=current();return `<div class="score-board" aria-label="${FIXTURE.team1Name} ${r.team1Score}, ${FIXTURE.team2Name} ${r.team2Score}"><span class="team-name">${FIXTURE.team1Name}</span><div class="big-score"><span>${r.team1Score}</span><i>:</i><span>${r.team2Score}</span></div><span class="team-name">${FIXTURE.team2Name}</span></div>`}
function queue(vertical=false){return `<div class="${vertical?'queue-gutter':'queue-strip'}" aria-label="Four review rallies">${reviewIds.map(id=>{const r=rallies.find(x=>x.id===id);return `<button class="queue-chip ${id===state.selectedId?'current':''} ${!pending(r)?'resolved':''}" data-act="queue" data-id="${id}" aria-label="Review rally ${r.number}${!pending(r)?', reviewed':''}" aria-current="${id===state.selectedId?'true':'false'}">${!pending(r)?'✓':r.number}</button>`}).join('')}</div>`}
function video(kind='review'){const r=current();const duration=state.editor?FIXTURE.durationMs:r.endMs-r.startMs;const elapsed=state.editor?state.positionMs:Math.max(0,state.positionMs-r.startMs);return `<section class="video ${kind}-video" aria-label="Synthetic volleyball video preview"><img src="${FRAME}" alt="Illustrated volleyball court with Cedar in blue near the camera and Harbor in white on the far side"/><div class="score-overlay"><span class="team">${FIXTURE.team1Name} <b>${r.team1Score}</b></span><span class="team"><b>${r.team2Score}</b> ${FIXTURE.team2Name}</span></div><span class="video-top-right">${state.editor?'Source · '+fmt(state.positionMs):'Rally '+r.number+' · '+((r.endMs-r.startMs)/1000).toFixed(1)+'s'}</span>${VARIANT===2 && kind==='review'?`<div class="queue-over">${reviewIds.map(id=>{const a=rallies.find(x=>x.id===id);return `<button class="queue-chip ${id===state.selectedId?'current':''} ${!pending(a)?'resolved':''}" data-act="queue" data-id="${id}" aria-label="Review rally ${a.number}">${pending(a)?a.number:'✓'}</button>`}).join('')}</div>`:''}<div class="transport"><button class="play" data-act="play" aria-label="${state.playing?'Pause':'Play'} simulated video">${ic(state.playing?'pause':'play')}</button><span class="clock" data-clock>${fmt(state.positionMs)} <span style="opacity:.55">/ ${fmt(state.editor?FIXTURE.durationMs:r.endMs)}</span></span><div class="timebar" aria-hidden="true"><span data-timefill style="width:${Math.min(100,elapsed/duration*100)}%"></span></div>${!state.editor?`<button class="icon-button bounds-shortcut" data-act="bounds" aria-label="Edit rally bounds">${ic('cut')}</button>`:''}</div></section>`}
function band(){return `<div class="review-band"><div class="spread"><strong>${pendingItems().length?pendingItems().length+' to review':'Review complete'}</strong><span class="muted">${progress()} / ${reviewIds.length} reviewed</span></div><div class="progress-dots" aria-label="${progress()} of ${reviewIds.length} reviewed">${reviewIds.map(id=>`<span class="${!pending(rallies.find(r=>r.id===id))?'done':''}"></span>`).join('')}</div></div>`}
function inclusion(){const r=current();return `<div class="choice-group" role="group" aria-label="Keep or remove rally"><button class="choice ${!r.needsClipReview&&r.included?'chosen':''}" data-act="keep" aria-pressed="${!r.needsClipReview&&r.included}">${ic('check')}Keep</button><button class="choice remove ${!r.needsClipReview&&!r.included?'chosen':''}" data-act="remove" aria-pressed="${!r.needsClipReview&&!r.included}">${ic('close')}Remove</button></div>`}
function serving(){const r=current();return `<div class="choice-group" role="group" aria-label="Serving side"><button class="choice ${r.servingSide==='near'?'chosen':''}" data-act="near" aria-pressed="${r.servingSide==='near'}">${ic('near')}Near</button><button class="choice ${r.servingSide==='far'?'chosen':''}" data-act="far" aria-pressed="${r.servingSide==='far'}">${ic('far')}Far</button></div>`}
function boundsButton(){const r=current();return `<button class="bounds-row" data-act="bounds">${ic('cut')}Bounds<span class="muted">${fmt(r.startMs,true)} — ${fmt(r.endMs,true)}</span>${ic('arrow')}</button>`}
function footer(){const r=current();const isPending=pending(r);return `<footer class="footer"><button class="primary" data-act="next" ${isPending?'disabled':''}>${pendingItems().length===1&&isPending?'Finish review':pendingItems().length===0?'Finish review':'Save & next'}${ic('arrow')}</button><div class="footer-note" aria-live="polite">${isPending?(r.needsClipReview&&r.servingSide==='review'?'Choose keep/remove and serving side':r.needsClipReview?'Choose keep or remove':'Choose the serving side'):`${ic('check')}${r.included?'Kept':'Removed'} · ${r.servingSide==='near'?'Near':'Far'} serve · saved`}</div>${VARIANT!==3?`<button class="secondary-link" data-act="browse">Browse all ${rallies.length} rallies</button>`:''}</footer>`}
function journalNav(active){return `<nav class="journal-nav" aria-label="Rally workspace"><button data-act="review" class="${active==='review'?'active':''}">${ic('check')}Review · ${pendingItems().length}</button><button data-act="browse" class="${active==='browse'?'active':''}">${ic('list')}All rallies · ${rallies.length}</button></nav>`}
function review(){const r=current();if(state.complete || !pendingItems().length && state.screen==='review' && !state.forceReview)return complete();if(VARIANT===1)return `${band()}${video()}<div class="review-controls"><div><div class="action-title"><span>Include rally ${r.number}?</span><span>${r.needsClipReview?'Decision needed':r.included?'Kept ✓':'Removed ✓'}</span></div>${inclusion()}</div><div class="serve"><div class="action-title"><span>Serving side</span><span>${r.servingSide==='review'?'Decision needed':r.servingSide==='near'?'Near ✓':'Far ✓'}</span></div>${serving()}</div>${boundsButton()}</div>${footer()}`;
if(VARIANT===2)return `${video()}<section class="court-dock" aria-label="Rally decisions"><div class="dock-topline spread"><strong>${pendingItems().length} to review</strong><span>${progress()} of ${reviewIds.length} done</span></div><div class="dock-grid"><div><div class="action-title">Who served?</div><div class="mini-court" role="group" aria-label="Serving side"><button data-act="far" class="${r.servingSide==='far'?'chosen':''}" aria-pressed="${r.servingSide==='far'}">${ic('far')}Far</button><button data-act="near" class="${r.servingSide==='near'?'chosen':''}" aria-pressed="${r.servingSide==='near'}">${ic('near')}Near</button></div></div><div><div class="action-title">${r.needsClipReview?'Keep this rally?':r.included?'Kept in highlights':'Removed from highlights'}</div><div class="dock-include" role="group" aria-label="Keep or remove rally"><button class="choice ${!r.needsClipReview&&r.included?'chosen':''}" data-act="keep" aria-pressed="${!r.needsClipReview&&r.included}">${ic('check')}Keep</button><button class="choice remove ${!r.needsClipReview&&!r.included?'chosen':''}" data-act="remove" aria-pressed="${!r.needsClipReview&&!r.included}">${ic('close')}Remove</button></div></div></div>${boundsButton()}</section>${footer()}`;
let step=state.step;return `${scoreboard()}<div class="journal-stage">${queue(true)}${video()}</div><div class="journal-meta"><strong>Rally ${r.number}</strong><button data-act="bounds">${ic('cut')}Edit bounds</button></div><section class="decision-panel"><div class="step-label"><span>${progress()} / ${reviewIds.length} reviewed</span><span>${step===0?'01 · Keep / remove':'02 · Serving side'}</span></div><h2>${step===0?'Keep this rally?':'Who served?'}</h2>${step===0?inclusion():serving()}<div class="decision-receipt"><button class="receipt-chip" data-act="step-clip">${ic(r.needsClipReview?'list':r.included?'check':'close')}${r.needsClipReview?'Keep / remove':r.included?'Kept':'Removed'}</button><button class="receipt-chip" data-act="step-serve">${ic('court')}${r.servingSide==='review'?'Serving side':r.servingSide==='near'?'Near serve':'Far serve'}</button></div></section>${footer()}${journalNav('review')}`;
}
function complete(){return `${VARIANT===3?scoreboard():band()}${video('complete')}<section class="complete"><div class="complete-icon">${ic('check')}</div><h2>Ready to browse.</h2><p>All ${reviewIds.length} reviewed. Your choices are saved.</p><button class="primary" data-act="browse">Browse ${rallies.length} rallies${ic('arrow')}</button><button class="secondary" data-act="review-again">Revisit decisions</button></section>${VARIANT===3?journalNav('review'):''}`}
function cards(){return `<div class="cards" role="list" aria-label="All rally cards">${[...rallies].sort((a,b)=>a.startMs-b.startMs).map(r=>`<button class="rally-card ${r.id===state.selectedId?'selected':''}" role="listitem" data-act="select" data-id="${r.id}" aria-label="Rally ${r.number}, ${FIXTURE.team1Name} ${r.team1Score}, ${FIXTURE.team2Name} ${r.team2Score}${!r.included?', removed':''}" aria-current="${r.id===state.selectedId?'true':'false'}"><img src="${FRAME}" alt="Rally ${r.number} start frame"/><span class="card-copy"><strong>Rally ${r.number}</strong><span class="card-score">${FIXTURE.team1Name} ${r.team1Score} : ${r.team2Score} ${FIXTURE.team2Name}</span><span class="card-meta">${fmt(r.startMs)} · ${pending(r)?'Needs review':!r.included?'Removed':r.servingSide==='near'?'Near serve · kept':'Far serve · kept'}</span></span>${pending(r)?'<span class="pending-dot" aria-hidden="true"></span>':''}</button>`).join('')}</div>`}
function sourceSide(){if(state.collapsed)return '';return `<aside class="source-side" aria-label="Source proportional vertical timeline"><small>00:00</small><div class="source-track" tabindex="0" role="slider" aria-label="Source position; use arrow keys to seek, choose Editor in gaps" aria-valuemin="0" aria-valuemax="${FIXTURE.durationMs}" aria-valuenow="${Math.round(state.positionMs)}" aria-valuetext="${fmt(state.positionMs)}" data-source>${rallies.map(r=>`<span class="segment ${pending(r)?'pending':''} ${r.id===state.selectedId?'selected':''}" style="top:${r.startMs/FIXTURE.durationMs*100}%;height:${(r.endMs-r.startMs)/FIXTURE.durationMs*100}%"></span>`).join('')}<span class="playhead" style="top:${state.positionMs/FIXTURE.durationMs*100}%"></span></div><small>${fmt(FIXTURE.durationMs)}</small></aside>`}
function browse(){return `${VARIANT===3?scoreboard():''}${video('browse')}<section class="library"><div class="library-head"><strong>${VARIANT===3?'Match index':'All rallies'} <span class="muted" style="font-size:12px;font-weight:400">${rallies.length}</span></strong><button data-act="collapse" aria-expanded="${!state.collapsed}" class="row">${ic(state.collapsed?'expand':'collapse')}${state.collapsed?'Show timeline':'Hide timeline'}</button></div><div class="browse-body">${sourceSide()}${cards()}</div>${state.gap?`<div class="gap-message"><span>Between rallies · ${fmt(state.positionMs)}</span><button data-act="edit-here">Open Editor ↗</button></div>`:''}</section><div class="browse-bottom"><button class="secondary" data-act="edit-gap">${ic('plus')}Edit between rallies</button>${VARIANT!==3?`<button class="text-button" data-act="review">${pendingItems().length?'Continue review · '+pendingItems().length+' left':'Revisit review decisions'}</button>`:''}</div>${VARIANT===3?journalNav('browse'):''}`}
function gapAround(pos){const sorted=[...rallies].sort((a,b)=>a.startMs-b.startMs);const inside=sorted.find(r=>pos>=r.startMs&&pos<=r.endMs);if(inside)return {inside};const prev=sorted.filter(r=>r.endMs<pos).at(-1);const next=sorted.find(r=>r.startMs>pos);return {prev,next,start:prev?prev.endMs:0,end:next?next.startMs:FIXTURE.durationMs}}
function nextGap(){const r=current();const next=[...rallies].sort((a,b)=>a.startMs-b.startMs).find(a=>a.startMs>r.endMs);return r.endMs+((next?next.startMs:FIXTURE.durationMs)-r.endMs)/2}
function editor(){const g=gapAround(state.positionMs);return `<div class="editor-head"><button data-act="return">${ic('back')}Return to Rallies</button></div>${video('editor')}<section class="editor-panel"><div class="spread"><span class="eyebrow">Full Editor</span><span class="muted" style="font-size:11px">Practice match</span></div><div class="position">${fmt(state.positionMs,true)}</div><div class="editor-ruler" aria-hidden="true">${rallies.map(r=>`<span class="editor-clip" style="left:${50+(r.startMs-state.positionMs)/120000*100}%;width:${(r.endMs-r.startMs)/120000*100}%"></span>`).join('')}</div><label class="source-slider"><span class="eyebrow">Source position</span><input aria-label="Full editor source position" type="range" min="0" max="${FIXTURE.durationMs}" step="100" value="${state.positionMs}" data-editor-seek/></label><div class="editor-labels"><span>00:00</span><span>${fmt(FIXTURE.durationMs)}</span></div><p>${g.inside?`Inside rally ${g.inside.number}. Seek into a gap to add a missed rally.`:`Unmarked time · ${fmt(g.start)} — ${fmt(g.end)}`}</p>${state.added?`<div class="saved-note" role="status">✓ Rally ${state.added} added · kept, near serve</div>`:''}<button class="primary" data-act="add" ${g.inside?'disabled':''}>${ic('plus')}Add rally here</button><button class="secondary" data-act="next-gap">Jump to gap after rally ${current().number}</button><button class="text-button" data-act="return" style="width:100%">${ic('back')}Return to Rallies</button></section>`}
function bounds(){if(!draft){const r=current();draft={start:r.startMs,end:r.endMs,min:Math.max(0,r.startMs-8000),max:Math.min(FIXTURE.durationMs,r.endMs+8000)}}return `<div class="modal-shade"><section class="bounds-sheet" role="dialog" aria-modal="true" aria-labelledby="bounds-title"><div class="sheet-handle"></div><div class="sheet-title"><span id="bounds-title">Rally ${current().number} bounds</span><button class="icon-button" data-act="cancel-bounds" aria-label="Close bounds editor">${ic('close')}</button></div><div class="frames" aria-label="Rally frame strip">${[1,2,3,4].map(()=>`<img alt="" src="${FRAME}"/>`).join('')}</div>${['start','end'].map(k=>`<div class="bound-label"><label for="bound-${k}">${k==='start'?'Start':'End'}</label><output data-bound-time="${k}">${fmt(draft[k],true)}</output></div><div class="bound-controls"><button data-act="nudge" data-bound="${k}" data-delta="-100" aria-label="Move ${k} earlier by 0.1 seconds">− .1</button><input id="bound-${k}" type="range" min="${draft.min}" max="${draft.max}" step="100" value="${draft[k]}" data-bound-range="${k}" aria-label="Rally ${k} time"/><button data-act="nudge" data-bound="${k}" data-delta="100" aria-label="Move ${k} later by 0.1 seconds">+ .1</button></div>`).join('')}<div class="duration" data-duration>${((draft.end-draft.start)/1000).toFixed(1)}s selected · adjust in 0.1s steps</div><div class="sheet-actions"><button class="secondary" data-act="cancel-bounds">Cancel</button><button class="primary" data-act="save-bounds">Save bounds${ic('check')}</button></div></section></div>`}
function render(){root.innerHTML=`<div class="appbody" ${state.overlay?'inert':''}>${header()}${notice?`<div class="notice" role="status">${notice}</div>`:''}${state.editor?editor():state.screen==='browse'?browse():review()}</div>${state.overlay?bounds():''}`;document.querySelectorAll('[data-preview]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.preview===(state.overlay?'bounds':state.screen))));if(state.screen==='browse'&&!state.editor){requestAnimationFrame(()=>{const list=root.querySelector('.cards');const item=list?.querySelector('.selected');if(list&&item)list.scrollTop=item.offsetTop-list.offsetTop-Math.max(0,(list.clientHeight-item.clientHeight)/2);})}}
function select(id,review=false){state.selectedId=id;state.positionMs=current().startMs;state.playing=false;state.gap=false;state.complete=false;state.forceReview=true;state.step=current().needsClipReview?0:1;if(review){state.screen='review';state.editor=false;}notice='';render()}
function setScreen(screen){state.playing=false;state.editor=false;state.overlay=screen==='bounds'?'bounds':null;draft=null;state.screen=screen==='browse'?'browse':'review';state.complete=false;state.forceReview=false;notice='';if(screen!=='browse'){const first=pendingItems().find(r=>r.id===FIXTURE.selectedRallyId)||pendingItems()[0];if(first){state.selectedId=first.id;state.positionMs=first.id===FIXTURE.selectedRallyId?FIXTURE.positionMs:first.startMs;state.step=first.needsClipReview?0:1;}}const u=new URL(location.href);u.searchParams.set('screen',screen);history.replaceState({},'',u);render()}
function openEditor(pos){state.returnScreen=state.screen;state.editor=true;state.playing=false;state.positionMs=pos;state.gap=false;state.added=null;notice='';render()}
function seekSource(pos){state.positionMs=Math.max(0,Math.min(FIXTURE.durationMs,pos));state.playing=false;const found=rallies.find(r=>pos>=r.startMs&&pos<=r.endMs);if(found){state.selectedId=found.id;state.gap=false;}else state.gap=true;render()}
function updateDraft(k,value){if(k==='start')draft.start=Math.min(draft.end-500,Math.max(draft.min,value));else draft.end=Math.max(draft.start+500,Math.min(draft.max,value));root.querySelector(`[data-bound-time="${k}"]`).textContent=fmt(draft[k],true);root.querySelector(`[data-bound-range="${k}"]`).value=draft[k];root.querySelector('[data-duration]').textContent=((draft.end-draft.start)/1000).toFixed(1)+'s selected · adjust in 0.1s steps'}
document.addEventListener('click',e=>{const preview=e.target.closest('[data-preview]');if(preview){setScreen(preview.dataset.preview);return}if(e.target.closest('[data-reset]')){rallies=clone(FIXTURE.rallies);persist();state.selectedId=FIXTURE.selectedRallyId;state.positionMs=FIXTURE.positionMs;state.step=0;state.collapsed=false;state.forceReview=false;setScreen('review');return}const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;const r=current();if(a==='play'){state.playing=!state.playing;if(state.playing&&!state.editor&&(state.positionMs<r.startMs||state.positionMs>=r.endMs))state.positionMs=r.startMs;render();return}if(a==='keep'||a==='remove'){r.included=a==='keep';r.needsClipReview=false;state.step=1;persist();render();return}if(a==='near'||a==='far'){r.servingSide=a;persist();render();return}if(a==='next'){if(pending(r))return;persist();const remaining=pendingItems();if(!remaining.length){state.complete=true;state.forceReview=false;state.playing=false;render()}else{const next=remaining.find(x=>x.startMs>r.startMs)||remaining[0];select(next.id,true)}return}if(a==='queue'){select(b.dataset.id,true);return}if(a==='select'){select(b.dataset.id);return}if(a==='browse'){setScreen('browse');return}if(a==='review'){if(pendingItems().length)setScreen('review');else{state.screen='review';state.forceReview=true;state.complete=false;state.editor=false;state.step=0;render()}return}if(a==='review-again'){state.complete=false;state.forceReview=true;state.step=0;state.selectedId=FIXTURE.selectedRallyId;state.positionMs=current().startMs;render();return}if(a==='collapse'){state.collapsed=!state.collapsed;render();return}if(a==='bounds'){state.playing=false;state.overlay='bounds';draft=null;render();root.querySelector('[data-act=cancel-bounds]').focus();return}if(a==='nudge'){updateDraft(b.dataset.bound,draft[b.dataset.bound]+Number(b.dataset.delta));return}if(a==='cancel-bounds'){state.overlay=null;draft=null;render();return}if(a==='save-bounds'){r.startMs=draft.start;r.endMs=draft.end;state.positionMs=r.startMs;state.overlay=null;draft=null;persist();notice='Bounds saved';render();return}if(a==='step-clip'){state.step=0;render();return}if(a==='step-serve'){state.step=1;render();return}if(a==='editor'){if(!state.editor)openEditor(state.positionMs);return}if(a==='rallies'||a==='return'){state.editor=false;state.screen=state.returnScreen;state.playing=false;notice=state.added?'Rally '+state.added+' added':'';render();return}if(a==='edit-gap'){openEditor(nextGap());return}if(a==='edit-here'){openEditor(state.positionMs);return}if(a==='next-gap'){state.positionMs=nextGap();state.added=null;render();return}if(a==='add'){const g=gapAround(state.positionMs);if(g.inside)return;let number=String(g.prev?.number||0)+'a';while(rallies.some(x=>String(x.number)===number))number+='a';const source=g.next||g.prev||r;const n={id:'A'+Date.now().toString(36),number,startMs:Math.max(g.start+100,state.positionMs-4000),endMs:Math.min(g.end-100,state.positionMs+4000),team1Score:source.team1Score,team2Score:source.team2Score,included:true,needsClipReview:false,servingSide:'near'};if(n.endMs-n.startMs<500){notice='Choose a wider unmarked gap';render();return}rallies.push(n);state.selectedId=n.id;state.positionMs=n.startMs;state.added=number;persist();render();return}});
document.addEventListener('input',e=>{if(e.target.dataset.boundRange)updateDraft(e.target.dataset.boundRange,Number(e.target.value));if(e.target.hasAttribute('data-editor-seek')){state.positionMs=Number(e.target.value);state.playing=false;state.added=null;const label=root.querySelector('.position');if(label)label.textContent=fmt(state.positionMs,true)}});
document.addEventListener('change',e=>{if(e.target.hasAttribute('data-editor-seek'))render()});
root.addEventListener('click',e=>{const t=e.target.closest('[data-source]');if(!t)return;const rect=t.getBoundingClientRect();seekSource((e.clientY-rect.top)/rect.height*FIXTURE.durationMs)});
document.addEventListener('keydown',e=>{if(state.overlay){if(e.key==='Escape'){state.overlay=null;draft=null;render();return}if(e.key==='Tab'){const f=[...root.querySelectorAll('.bounds-sheet button,.bounds-sheet input')].filter(x=>!x.disabled);if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f.at(-1).focus()}if(!e.shiftKey&&document.activeElement===f.at(-1)){e.preventDefault();f[0].focus()}}}if(e.target.matches('[data-source]')&&['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();seekSource(e.key==='Home'?0:e.key==='End'?FIXTURE.durationMs:state.positionMs+(e.key==='ArrowDown'?10000:-10000));root.querySelector('[data-source]')?.focus()}});
setInterval(()=>{if(!state.playing)return;const r=current();state.positionMs+=250;const end=state.editor?FIXTURE.durationMs:r.endMs;if(state.positionMs>=end){state.positionMs=end;state.playing=false;render();return}const clock=root.querySelector('[data-clock]');if(clock)clock.innerHTML=fmt(state.positionMs)+` <span style="opacity:.55">/ ${fmt(end)}</span>`;const fill=root.querySelector('[data-timefill]');if(fill)fill.style.width=((state.editor?state.positionMs:state.positionMs-r.startMs)/(state.editor?FIXTURE.durationMs:r.endMs-r.startMs)*100)+'%';},250);
window.prototypeState=()=>clone({state,rallies,pendingCount:pendingItems().length,reviewed:progress(),initialReviewCount:reviewIds.length,draft});
window.addEventListener('error',e=>{document.documentElement.dataset.runtimeError=e.message});
render();
</script></body></html>
