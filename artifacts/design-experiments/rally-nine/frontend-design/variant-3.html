function decisions(){const r=current(),clipPending=r.needsClipReview,servePending=r.servingSide==='review',unresolved=clipPending||servePending;const hint=unresolved?('Choose '+(clipPending&&servePending?'keep/remove and serving side':clipPending?'keep or remove':'serving side')):((r.included?'Kept':'Removed')+' · '+(r.servingSide==='near'?'Near':'Far')+' serves · saved');return '<section class="decision-panel" aria-label="Rally decisions"><div class="decision-heading"><strong>'+title(r)+'</strong><span>'+duration(r)+'</span></div><div class="decision-group keep-remove" role="group" aria-label="Keep or remove rally"><button data-action="keep" aria-pressed="'+(!clipPending&&r.included)+'">'+icon('check')+'Keep</button><button data-action="remove" aria-pressed="'+(!clipPending&&!r.included)+'">'+icon('x')+'Remove</button></div>'+serve()+'<p class="hint '+(!unresolved?'saved':'')+'" aria-live="polite">'+hint+'</p><div class="next-row"><button class="link" data-action="gap">Edit a gap</button><button class="primary" data-action="next" '+(unresolved?'disabled':'')+'>'+(pending().length?'Next review':'Finish review')+icon('next')+'</button></div></section>';}

function queue(){return '<aside class="rail-review" aria-label="Review queue"><span class="rail-label">Review</span>'+initialQueue.map((id,i)=>{const r=rallies.find(r=>r.id===id);return (i?'<i class="queue-connector"></i>':'')+'<button class="queue-button '+(selected===id?'current ':!needs(r)?'done':'')+'" data-queue="'+id+'" aria-label="Review rally '+r.number+'" '+(selected===id?'aria-current="true"':'')+'>'+(!needs(r)?icon('check'):r.number)+'</button>';}).join('')+'<span class="queue-progress">'+done()+'/'+initialQueue.length+'</span></aside>';}
function map(){return '<aside class="timeline '+(collapsed?'collapsed':'')+'" aria-label="Source timeline"><button class="timeline-toggle" data-action="timeline" aria-label="'+(collapsed?'Show timeline':'Collapse timeline')+'" aria-expanded="'+!collapsed+'">'+icon(collapsed?'expand':'timeline')+'</button><span class="timeline-label">0:00</span><div class="map" role="slider" tabindex="0" aria-label="Source position" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="'+FIXTURE.durationMs+'" aria-valuenow="'+Math.round(position)+'" aria-valuetext="'+time(position)+'">'+rallies.map(r=>'<i class="segment '+(needs(r)?'pending ':'')+(r.id===selected&&!gap?'selected':'')+'" style="top:'+(r.startMs/FIXTURE.durationMs*100)+'%;height:'+((r.endMs-r.startMs)/FIXTURE.durationMs*100)+'%"></i>').join('')+'<i class="source-marker" style="top:'+(position/FIXTURE.durationMs*100)+'%"></i></div><span class="source-time">'+time(FIXTURE.durationMs)+'</span></aside>';}
function card(r){return '<button class="rally-card '+(r.id===selected&&!gap?'selected':'')+'" data-rally="'+r.id+'" '+(r.id===selected&&!gap?'aria-current="true"':'')+' aria-label="'+title(r)+', '+FIXTURE.team1Name+' '+r.team1Score+', '+FIXTURE.team2Name+' '+r.team2Score+'"><img class="thumb" src="'+FRAME+'" alt="Start frame"><span class="card-text"><strong>'+title(r)+'</strong><small>'+FIXTURE.team1Name+' '+r.team1Score+' : '+r.team2Score+' '+FIXTURE.team2Name+'</small></span><span class="card-tail"><span>'+time(r.startMs)+'</span>'+(needs(r)?'<i class="needs-dot" aria-label="Needs review"></i>':icon(r.included?'check':'x'))+'</span></button>';}
function browse(){return stage()+'<div class="browse-top"><div><strong>All rallies</strong><span class="small-count">'+rallies.filter(r=>r.included).length+' kept</span></div>'+(pending().length?'<button class="link" data-action="review">Review '+pending().length+'</button>':'<span class="hint saved">All reviewed</span>')+'</div><section class="browser" aria-label="Browse rallies">'+map()+'<div class="rally-list">'+rallies.slice().sort((a,b)=>a.startMs-b.startMs).map(card).join('')+'</div></section><footer class="browse-footer"><button class="edit-selected" data-action="edit-position">'+icon('bounds')+'Edit '+(gap?'here':'rally')+'</button><button class="primary" data-action="gap">'+icon('plus')+'Missed rally</button></footer>';}
function openBounds(returnTo){boundsReturn=returnTo==='bounds'?'review':returnTo;draft={startMs:current().startMs,endMs:current().endMs};view='bounds';playing=false;gap=false;position=draft.startMs;render();}
function bounds(){if(!draft)draft={startMs:current().startMs,endMs:current().endMs};const r=current();return stage()+'<section class="bounds-panel" aria-label="Edit rally bounds"><div class="panel-title"><strong>Rally bounds</strong><span>'+((draft.endMs-draft.startMs)/1000).toFixed(1)+' seconds</span></div>'+['start','end'].map(type=>'<div class="bound-row"><div class="bound-readout">'+(type==='start'?'Start':'End')+'<b class="'+type+'-readout">'+time(draft[type+'Ms'],true)+'</b></div><button class="step" data-step="'+type+':-500" aria-label="Move '+type+' earlier by half a second">'+icon('minus')+'</button><input type="range" data-bound="'+type+'" aria-label="Rally '+type+'" min="'+Math.max(0,r.originalStart-10000)+'" max="'+Math.min(FIXTURE.durationMs,r.originalEnd+10000)+'" value="'+draft[type+'Ms']+'" step="100"><button class="step" data-step="'+type+':500" aria-label="Move '+type+' later by half a second">'+icon('plus')+'</button></div>').join('')+'<p class="bound-help">Drag to trim. Each tap moves 0.5 seconds.</p><div class="bounds-actions"><button class="link" data-action="cancel-bounds">Cancel</button><button class="primary" data-action="save-bounds">'+icon('check')+'Save bounds</button></div></section>';}
function editor(){return '<div class="editor-band"><span>Full Editor</span><button data-action="return">'+icon('back')+'Back to Rallies</button></div>'+stage()+'<section class="editor-panel" aria-label="Full source editor"><div class="source-caption"><span>'+ (gap?'Gap selected':'Source position')+'</span><b class="editor-position">'+time(position,true)+'</b></div><div class="filmstrip" aria-hidden="true">'+Array(5).fill('<img src="'+FRAME+'" alt="">').join('')+'</div><input class="source-slider" type="range" aria-label="Full source position" min="0" max="'+FIXTURE.durationMs+'" step="100" value="'+position+'"><p class="hint">'+(gap?'Add the missed play here, then return to your rallies.':'Move into a gap to add a missed rally.')+'</p><button class="link" data-action="jump-gap">Jump to next gap</button><button class="primary" data-action="add" '+(!gap?'disabled':'')+'>'+icon('plus')+'Add rally here</button></section>';}
function complete(){return stage()+'<section class="complete-panel"><div class="done-icon">'+icon('check')+'</div><h2>Review complete</h2><p>'+done()+' reviewed. Your choices are saved.</p><button class="primary" data-action="browse">'+icon('list')+'Browse all '+rallies.length+' rallies</button></section>';}
function render(){const list=$('.rally-list'),oldScroll=list?.scrollTop;$('#root').innerHTML='<main class="app '+view+'" aria-label="VolleySplice '+view+'">'+topbar()+(view==='editor'?'':strip())+'<div class="content">'+(view==='review'?(VARIANT===3?ribbon():'')+stage()+(VARIANT===3?queue():'')+decisions():view==='browse'?browse():view==='bounds'?bounds():view==='editor'?editor():complete())+'</div><div class="app-footer" aria-hidden="true"></div></main>';document.querySelectorAll('[data-screen]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.screen===view));if(oldScroll&&$('.rally-list'))$('.rally-list').scrollTop=oldScroll;}
function select(id,review=false){selected=id;position=current().startMs;gap=false;playing=false;if(review)view='review';render();if(view==='browse')$('.rally-card.selected')?.scrollIntoView({block:'nearest'});}
function enterEditor(atGap=false){editorReturn=view==='editor'?editorReturn:view==='bounds'?boundsReturn:view==='complete'?'browse':view;playing=false;view='editor';if(atGap)nextGap();else render();}
function nextGap(){const r=current(),ordered=rallies.slice().sort((a,b)=>a.startMs-b.startMs);let before=r;let next=ordered.find(item=>item.startMs>before.endMs);let from=before.endMs+1000,to=next?next.startMs-1000:FIXTURE.durationMs-1000;if(to<=from){position=20000;}else position=(from+to)/2;gap=!rallies.some(item=>position>=item.startMs&&position<=item.endMs);playing=false;render();}
function setPosition(ms){position=Math.max(0,Math.min(FIXTURE.durationMs,ms));const r=rallies.find(r=>position>=r.startMs&&position<=r.endMs);gap=!r;if(r)selected=r.id;playing=false;render();}
function adjustBound(type,value){const r=current();value=Math.max(0,Math.min(FIXTURE.durationMs,value));draft[type+'Ms']=type==='start'?Math.min(value,draft.endMs-500):Math.max(value,draft.startMs+500);position=draft[type+'Ms'];playing=false;}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.screen){const s=b.dataset.screen;playing=false;gap=false;if(s==='bounds')openBounds('review');else{view=s;if(s==='review'&&needs(current())===false&&pending().length)selected=pending()[0].id;position=current().startMs;render();if(s==='browse')$('.rally-card.selected')?.scrollIntoView({block:'nearest'});}return;}if(b.dataset.rally){select(b.dataset.rally);return;}if(b.dataset.queue){select(b.dataset.queue,true);return;}if(b.dataset.step){const [type,n]=b.dataset.step.split(':');adjustBound(type,draft[type+'Ms']+Number(n));render();return;}const a=b.dataset.action,r=current();if(['keep','remove'].includes(a)){r.included=a==='keep';r.needsClipReview=false;save();render();}else if(['near','far'].includes(a)){r.servingSide=a;save();render();}else if(a==='play'){playing=!playing;render();}else if(a==='next'){if(needs(r))return;const queue=pending();if(!queue.length){view='complete';playing=false;render();}else{const next=queue.find(x=>x.startMs>r.startMs)||queue[0];select(next.id,true);}}else if(a==='browse'){view='browse';playing=false;gap=false;render();$('.rally-card.selected')?.scrollIntoView({block:'nearest'});}else if(a==='review'){const p=pending();if(p.length)select(p[0].id,true);else{view='complete';render();}}else if(a==='timeline'){collapsed=!collapsed;render();}else if(a==='bounds')openBounds(view);else if(a==='save-bounds'){r.startMs=draft.startMs;r.endMs=draft.endMs;position=r.startMs;save();view=boundsReturn;draft=null;render();notice('Bounds saved');}else if(a==='cancel-bounds'){view=boundsReturn;draft=null;position=r.startMs;render();}else if(a==='editor'){enterEditor(false);}else if(a==='edit-position'){if(gap)enterEditor(false);else{view='review';playing=false;render();}}else if(a==='gap'){enterEditor(true);}else if(a==='jump-gap')nextGap();else if(a==='return'||a==='rallies'){if(view==='editor'){view=gap?'browse':editorReturn;render();if(view==='browse')$('.rally-card.selected')?.scrollIntoView({block:'nearest'});}else if(a==='rallies'){view=pending().length?'review':'browse';render();}}else if(a==='add'){if(!gap)return;const ordered=rallies.slice().sort((a,b)=>a.startMs-b.startMs),previous=ordered.filter(x=>x.endMs<position).pop(),next=ordered.find(x=>x.startMs>position);const start=Math.max((previous?.endMs||0)+100,position-3000),end=Math.min((next?.startMs||FIXTURE.durationMs)-100,position+3000);if(end-start<500){notice('Choose a wider gap');return;}const id='added-'+Date.now(),base=previous||r;const number=String(base.number).replace(/[a-z]+$/,'')+String.fromCharCode(97+rallies.filter(x=>x.added).length);rallies.push({id,number,startMs:start,endMs:end,originalStart:start,originalEnd:end,team1Score:base.team1Score,team2Score:base.team2Score,included:true,needsClipReview:false,servingSide:base.servingSide==='review'?'near':base.servingSide,added:true});selected=id;gap=false;save();render();notice('Rally added · '+((end-start)/1000).toFixed(1)+'s');}else if(a==='reset'){try{localStorage.removeItem(key);}catch(e){}rallies=initial();view='review';selected=FIXTURE.selectedRallyId;position=FIXTURE.positionMs;playing=false;gap=false;draft=null;collapsed=false;render();notice('Sample reset');}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.bound){const type=t.dataset.bound;adjustBound(type,Number(t.value));t.value=draft[type+'Ms'];$('.'+type+'-readout').textContent=time(draft[type+'Ms'],true);$('.panel-title span').textContent=((draft.endMs-draft.startMs)/1000).toFixed(1)+' seconds';$('.position-text').textContent=time(position);$('.play-track i').style.width=((position-draft.startMs)/(draft.endMs-draft.startMs)*100)+'%';}else if(t.classList.contains('source-slider'))setPosition(Number(t.value));});
document.addEventListener('pointerdown',e=>{const m=e.target.closest('.map');if(!m)return;const rect=m.getBoundingClientRect();setPosition((e.clientY-rect.top)/rect.height*FIXTURE.durationMs);});
document.addEventListener('keydown',e=>{if(!e.target.matches('.map'))return;if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();const value=e.key==='Home'?0:e.key==='End'?FIXTURE.durationMs:position+(e.key==='ArrowDown'?10000:-10000);setPosition(value);$('.map')?.focus();}});
setInterval(()=>{if(!playing)return;const r=view==='bounds'?draft:current(),end=view==='editor'?FIXTURE.durationMs:r.endMs;position=Math.min(position+250,end);if(position>=end){playing=false;render();return;}$('.position-text')&&($('.position-text').textContent=time(position));const p=$('.play-track i');if(p)p.style.width=Math.max(0,Math.min(100,(position-r.startMs)/(r.endMs-r.startMs)*100))+'%';if($('.source-marker'))$('.source-marker').style.top=position/FIXTURE.durationMs*100+'%';},250);
window.__inspect=()=>({variant:VARIANT,view,selected,position,playing,gap,collapsed,rallies:structuredClone(rallies),pending:pending().map(r=>r.id),done:done(),draft:draft?{...draft}:null});
render();if(view==='browse')$('.rally-card.selected')?.scrollIntoView({block:'nearest'});
</script></body></html>
