server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ^~ /runtime/ {
    try_files $uri =404;
    types {
      application/javascript js mjs;
      application/json json;
      application/wasm wasm;
      image/png png;
    }
    add_header Cache-Control "public, max-age=3600";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location ^~ /licenses/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location ^~ /android/ {
    try_files $uri =404;
    types {
      application/vnd.android.package-archive apk;
    }
    add_header Cache-Control "public, max-age=3600";
    add_header Content-Disposition "attachment" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
}
