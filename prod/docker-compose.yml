name: volleycut-prod

services:
  web:
    image: volleycut-prod:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    networks:
      - websecure
    labels:
      - traefik.enable=true
      - traefik.http.services.volleycut-prod.loadbalancer.server.port=8080
      - traefik.http.middlewares.volleycut-prod-compress.compress=true
      - traefik.http.routers.volleycutexternal.rule=Host(`volleycut.vafrederico.com`)
      - traefik.http.routers.volleycutexternal.entrypoints=websecure
      - traefik.http.routers.volleycutexternal.service=volleycut-prod
      - traefik.http.routers.volleycutexternal.priority=10
      - traefik.http.routers.volleycutexternal.tls.certresolver=letsencrypt
      - traefik.http.routers.volleycutexternal.middlewares=volleycut-prod-compress

networks:
  websecure:
    external: true
