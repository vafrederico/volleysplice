  <g id="text_27">
   <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #162536" x="46.728" y="32.973187" transform="rotate(-0 46.728 32.973187)">Start type and the matching rally end both matter</text>
  </g>
  <g id="text_28">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #4b5563" x="46.728" y="51.1344" transform="rotate(-0 46.728 51.1344)">Automatic candidate quality · 1-second boundary tolerance · endpoints scored on the same matched rally</text>
  </g>
  <g id="text_29">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #536171" x="46.728" y="445.7376" transform="rotate(-0 46.728 445.7376)">The first gold rally within a production parent component is the initial target; later rallies are additional targets. Incorrect type assignments cannot match.</text>
  </g>
  <g id="text_30">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #536171" x="46.728" y="459.7272" transform="rotate(-0 46.728 459.7272)">Joint F1 requires both observed endpoints correct on that same typed start match. Artificial partition boundaries and clipped endpoints cannot count as observed predictions.</text>
  </g>
  <g id="text_31">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #536171" x="46.728" y="473.7168" transform="rotate(-0 46.728 473.7168)">Three-seed means after pooling recordings. Development timing proxies only; these are automatic candidates, not corrected human outcomes.</text>
  </g>
